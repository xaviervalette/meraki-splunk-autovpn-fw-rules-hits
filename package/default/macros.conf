# --- Edit these three to match your environment -------------------------

# Where the MX syslog lands (already collected).
[meraki_vpnfw_syslog]
definition = index=syslog sourcetype=cisco:meraki

# Index chosen on the TA input (rules + appliances polled from the API).
[meraki_vpnfw_api_index]
definition = index=*

# Summary index written by "Meraki VPN FW - Hits summary".
[meraki_vpnfw_summary_index]
definition = index=summary

# --- Internals ------------------------------------------------------------

# Parse one MX syslog line into fw_category, mx_hostname, mx_mac, fw_pattern
# and the canonical rule signature. Must stay byte-identical to
# bin/meraki_vpnfw_signature.py (see tests/test_signature.py).
[meraki_vpnfw_parse]
definition = rex "<\d+>1\s+\S+\s+(?<mx_hostname>\S+)" \
| rex field=mx_hostname "-(?<_mac>[0-9a-fA-F]{12})$" \
| eval mx_mac=lower(replace(_mac, "(..)(..)(..)(..)(..)(..)", "\1:\2:\3:\4:\5:\6")) \
| rex "\s(?<fw_category>vpn_firewall|cellular_firewall|firewall)\s+src=" \
| rex "pattern:\s+(?<fw_pattern>.+?)\s*$" \
| eval _pol=lower(mvindex(split(fw_pattern, " "), 0)), _pol=case(_pol=="1", "allow", _pol=="0", "deny", true(), _pol) \
| eval _c=split(trim(replace(fw_pattern, "^\S+\s*", "")), " && ") \
| eval _c=mvmap(_c, mvjoin(mvsort(split(lower(trim(trim(trim(_c), "()"))), " || ")), " || ")) \
| eval signature=_pol."|".mvjoin(mvsort(_c), " && ") \
| fields - _mac _pol _c
iseval = 0

# Hit counts straight from syslog: exact, slower on long ranges.
[meraki_vpnfw_hits_raw]
definition = `meraki_vpnfw_syslog` vpn_firewall "pattern:" \
| `meraki_vpnfw_parse` \
| where fw_category=="vpn_firewall" \
| lookup meraki_vpnfw_appliances mac AS mx_mac OUTPUT org_id mx_name \
| fillnull value="unknown" org_id mx_mac mx_name \
| stats count AS hits max(_time) AS last_hit by org_id mx_mac mx_name signature fw_pattern
iseval = 0

# Same shape, read from the hourly summary: fast, up to 1 hour behind.
[meraki_vpnfw_hits_summary]
definition = `meraki_vpnfw_summary_index` source="Meraki VPN FW - Hits summary" \
| stats sum(hits) AS hits max(last_hit) AS last_hit by org_id mx_mac mx_name signature fw_pattern
iseval = 0
