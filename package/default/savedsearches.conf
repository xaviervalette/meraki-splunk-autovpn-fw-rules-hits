# Latest API poll per org -> lookup. override_if_empty=false keeps the last
# good copy if the API is unreachable.
[Meraki VPN FW - Rules lookup]
search = `meraki_vpnfw_api_index` sourcetype="meraki:vpnfw:rule" \
| eventstats max(poll_id) AS last_poll by org_id \
| where poll_id==last_poll \
| eventstats min(rule_index) AS first_index by org_id signature \
| eval shadowed_by=if(rule_index!=first_index, first_index, "") \
| table org_id org_name rule_index rule_count is_default comment policy protocol srcCidr srcPort destCidr destPort syslogEnabled signature shadowed_by poll_id \
| sort 0 org_id rule_index \
| outputlookup override_if_empty=false meraki_vpnfw_rules
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -1d
dispatch.latest_time = now
schedule_window = auto

[Meraki VPN FW - Appliances lookup]
search = `meraki_vpnfw_api_index` sourcetype="meraki:vpnfw:appliance" \
| eventstats max(poll_id) AS last_poll by org_id \
| where poll_id==last_poll \
| eval mac=lower(mac), mx_name=name \
| dedup mac \
| table mac org_id org_name serial mx_name model networkId firmware \
| outputlookup override_if_empty=false meraki_vpnfw_appliances
cron_schedule = */5 * * * *
enableSched = 1
dispatch.earliest_time = -1d
dispatch.latest_time = now
schedule_window = auto

# Hourly hit counts per org / MX / rule signature into the summary index.
[Meraki VPN FW - Hits summary]
search = `meraki_vpnfw_hits_raw`
cron_schedule = 5 * * * *
enableSched = 1
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
action.summary_index = 1
action.summary_index._name = summary
